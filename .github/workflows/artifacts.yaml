name: Artifacts
on:
  workflow_dispatch:

jobs:
  artifact-producer:
    name: Produce artifact
    runs-on: macos-latest
    env:
        ARTIFACT_NAME: example-artifact
        ARTIFACT_PATH: artifact.txt
    outputs:
      ARTIFACT_NAME: $ARTIFACT_NAME
    steps:
      - name: Create artifact file
        run: |
          touch ${{ env.ARTIFACT_PATH }}
          # echo "This will be stored as an artifact!" > $ARTIFACT_PATH
          echo "Generated by artifact-producer job on $(date)" >> ${{ env.ARTIFACT_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}

  artifact-consumer:
    name: Consume artifact
    runs-on: ubuntu-24.04
    needs: artifact-producer
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5.0.0
        with:
          name: ${{ needs.outputs.ARTIFACT_NAME }}

      - name: Cat artifact file
        run: cat artifact.txt